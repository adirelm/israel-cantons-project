<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ישראל בחמישה קנטונים</title>
  <meta name="description" content="חלוקה של 255 רשויות מקומיות בישראל לחמישה קנטונים לפי דפוסי ההצבעה בחמש מערכות הבחירות 2019–2022.">
  <meta property="og:title" content="ישראל בחמישה קנטונים">
  <meta property="og:description" content="255 רשויות, חמש מערכות בחירות, חמישה קנטונים: מפה אינטראקטיבית מבוססת נתונים.">
  <meta property="og:image" content="https://adirelm.github.io/israel-cantons-project/og.png">
  <meta property="og:url" content="https://adirelm.github.io/israel-cantons-project/">
  <meta property="og:locale" content="he_IL">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='12' height='12' rx='2' fill='%23716bf6'/%3E%3Crect x='17' y='3' width='12' height='12' rx='2' fill='%233b82f6'/%3E%3Crect x='3' y='17' width='12' height='12' rx='2' fill='%2322c55e'/%3E%3Crect x='17' y='17' width='12' height='12' rx='2' fill='%231d4ed8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" data-i18n="brand">ישראל בקנטונים</a>
    <nav class="topnav">
      <a id="link-app" class="toplink" target="_blank" rel="noopener" data-i18n="research">למחקר המלא</a>
      <button id="lang-toggle" class="lang" type="button" aria-label="Switch language">English</button>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h1 data-i18n="title">ישראל בחמישה קנטונים</h1>
      <p class="lead" id="lead"></p>
      <ul class="facts" id="facts"></ul>
    </section>

    <section class="explorer" aria-label="Map">
      <div class="controls">
        <label class="search">
          <span class="visually-hidden" data-i18n="searchLabel">חיפוש רשות</span>
          <input id="search" type="search" list="town-names" autocomplete="off" data-i18n-placeholder="searchPlaceholder">
          <datalist id="town-names"></datalist>
        </label>
        <div class="elections" role="group" id="elections" data-i18n-aria="electionsLabel"></div>
      </div>

      <div class="map-wrap">
        <div id="map" dir="ltr" role="region" data-i18n-aria="mapLabel"></div>
        <div class="legend" id="legend"></div>
        <div class="map-actions">
          <button type="button" id="btn-share" class="action" data-i18n="share">העתקת קישור</button>
          <button type="button" id="btn-download" class="action" data-i18n="download">הורדת המפה</button>
        </div>
        <p class="election-note" id="election-note" hidden></p>
      </div>

      <aside class="panel" id="panel" aria-live="polite"></aside>
    </section>

    <section class="how">
      <h2 data-i18n="howTitle">איך זה עובד</h2>
      <ol class="steps" id="steps"></ol>
      <p class="caveat" id="caveat"></p>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
